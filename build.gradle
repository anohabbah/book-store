plugins {
    id 'java'
    id 'jacoco'
    id 'org.sonarqube' version '7.4.0.8496'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'net.ltgt.nullaway' version '3.2.0'
}

group = 'dev.abbah'
version = '0.0.1-SNAPSHOT'
description = 'book-store'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

nullaway {
    onlyNullMarked = true
    jspecifyMode = true
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true              // run only NullAway, skip the rest of Error Prone
        nullaway {
            error()                          // nullness violations fail the build
            treatGeneratedAsUnannotated = true   // skip @Generated code (e.g. MapStruct impls)
        }
    }
}

tasks.named('compileJava') {
    options.errorprone {
        error('RequireExplicitNullMarking')  // main types must be explicitly @NullMarked/@NullUnmarked
    }
}

ext {
    set('mapstructVersion', "1.7.0.Beta2")
    set('archUnitVersion', "1.5.0")
}

dependencies {
    implementation 'org.jspecify:jspecify:1.0.1'
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.1.0'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.julien-dubois.bootui:bootui-spring-boot-starter:1.15.0'
    runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'org.postgresql:postgresql'
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation "com.tngtech.archunit:archunit-junit5:${archUnitVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-grafana'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.15'                   // 0.8.14+ required to read Java 25 class files
}

tasks.named('jacocoTestReport') {
    reports {
        xml.required = true                  // the only format SonarQube consumes
        html.required = false
        csv.required = false
    }
}

sonar {
    properties {
        // Sources, test sources, binaries, dependency jars, JUnit reports and the
        // JaCoCo XML are all derived from the Gradle model by the plugin.
        // Server URL and credentials come from SONAR_HOST_URL / SONAR_TOKEN.
        property 'sonar.projectKey', 'book-store'
        property 'sonar.projectName', 'Book Store'
    }
}
