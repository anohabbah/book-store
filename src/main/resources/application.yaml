spring:
  application:
    name: book-store
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: on_param
  docker:
    compose:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: when_authorized
server:
  compression:
    enabled: true
  http2:
    enabled: true
