schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: book-store — a Spring Modulith bookstore backend (group dev.abbah, base
  package dev.abbah.bookstore). Currently a fresh scaffold; no business modules yet.

  Tech stack:
    - Java 25 (Gradle toolchain), Gradle 9.5.1, Groovy DSL (build.gradle)
    - Spring Boot 4.0.x, Spring Modulith 2.0.x (starter-core + starter-jdbc)
    - Web: Spring Web MVC, Bean Validation, springdoc-openapi (Swagger UI)
    - Persistence: Spring Data JDBC (NOT JPA/Hibernate), Flyway migrations, PostgreSQL
    - Mapping/boilerplate: MapStruct 1.7, Lombok (with lombok-mapstruct-binding)
    - Observability: Spring Boot Actuator + OpenTelemetry, Spring Modulith
      observability; Grafana OTel-LGTM stack via Testcontainers in tests
    - Testing: JUnit 5, Spring Boot Test, Testcontainers (PostgreSQL + Grafana LGTM)

  Conventions:
    - Conventional Commits (e.g. build:, chore:, feat:, fix:).
    - Null-safety is enforced at compile time: NullAway in JSpecify mode with
      onlyNullMarked = true; nullness violations FAIL the build. Every package needs
      a package-info.java annotated @NullMarked (org.jspecify.annotations). Main
      types must be explicitly null-marked (RequireExplicitNullMarking). Use
      org.jspecify @Nullable/@NonNull — never JSR-305 or org.springframework.lang.
      When writing or annotating null-safe code, consult the jspecify-* skills
      first: jspecify-user-guide (where annotations belong on params/returns/
      generics/arrays), jspecify-spring-null-safety and
      jspecify-spring-framework-patterns (Spring @Contract post-conditions and the
      @Nullable vs @SuppressWarnings("NullAway.Init") inference heuristics).
    - Indentation is 2 spaces.
    - Organize features as Spring Modulith application modules (one top-level package
      per module under dev.abbah.bookstore); respect module boundaries.
    - Prefer Spring Data JDBC aggregates and repositories; schema changes go through
      Flyway versioned migrations.
    - When designing or implementing backend code (REST APIs, services, data access,
      caching, async, logging) consult the springboot-* skills: springboot-patterns
      for architecture/layering and springboot-security for authn/authz, validation,
      CSRF, secrets, headers, and rate limiting.
    - For PostgreSQL work — query design, schema, indexing, and Flyway migrations —
      consult postgres-patterns and supabase-postgres-best-practices for query
      optimization and security. (This project uses Spring Data JDBC, not JPA, so the
      jpa-patterns skill does not apply.)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - State which Spring Modulith module(s) the change touches, or that it adds a new one.
  design:
    - Note null-safety implications; all new packages need @NullMarked package-info.java.
      For non-trivial nullness decisions, apply the jspecify-* skills (jspecify-user-guide,
      jspecify-spring-null-safety, jspecify-spring-framework-patterns).
    - Call out any new Flyway migration and the database tables/columns it adds; apply
      postgres-patterns / supabase-postgres-best-practices to schema and indexing
      decisions, and springboot-patterns / springboot-security to API and service design.
  tasks:
    - Generate tasks test-first, following the tdd skill (the red-green-refactor loop):
      write a failing test, make it pass, then refactor. Use the tdd skill specifically,
      not superpowers:test-driven-development.
    - When a task adds or annotates null-safe code, first consult the relevant jspecify-*
      skill before placing @Nullable/@NonNull/@Contract.
    - When a task implements backend or database code, apply the matching skill first:
      springboot-patterns / springboot-security for Spring code, postgres-patterns /
      supabase-postgres-best-practices for SQL, schema, and migrations.
    - Include a task to verify the build passes (./gradlew build) — NullAway nullness
      checks must stay green.
    - Add or update Testcontainers-backed integration tests for new behavior.
