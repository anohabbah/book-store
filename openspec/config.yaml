schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project: book-store — a Spring Modulith bookstore backend (group dev.abbah, base
  package dev.abbah.bookstore). Currently a fresh scaffold; no business modules yet.

  Tech stack:
    - Java 25 (Gradle toolchain), Gradle 9.5.1, Groovy DSL (build.gradle)
    - Spring Boot 4.0.x, Spring Modulith 2.0.x (starter-core + starter-jdbc)
    - Web: Spring Web MVC, Bean Validation, springdoc-openapi (Swagger UI)
    - Persistence: Spring Data JDBC (NOT JPA/Hibernate), Flyway migrations, PostgreSQL
    - Mapping/boilerplate: MapStruct 1.7, Lombok (with lombok-mapstruct-binding)
    - Observability: Spring Boot Actuator + OpenTelemetry, Spring Modulith
      observability; Grafana OTel-LGTM stack via Testcontainers in tests
    - Testing: JUnit Jupiter (Boot 4 ships JUnit 6), Spring Boot Test with
      @AutoConfigureMockMvc + MockMvcTester, Testcontainers (PostgreSQL + Grafana
      LGTM); integration tests are preferred. Every environment (dev, test, CI, prod)
      uses PostgreSQL — H2 and other in-memory databases are prohibited.

  Architecture & package layout:
    - Hexagonal (Ports & Adapters). Production code under
      src/main/java/dev/abbah/bookstore/ MUST be organized into two layers,
      domain/ and infra/:

      src/main/java/dev/abbah/bookstore/
      ├── domain/
      │   └── <domain_name>/
      │       ├── <Domain>.java              # Domain object (record)
      │       ├── <Domain>Usecase.java       # Business logic (@Service)
      │       └── <Domain>Port.java          # Port interface (driven)
      └── infra/
          ├── spi/                           # Driven adapters (outbound)
          │   ├── db/<domain_name>/
          │   │   ├── <Domain>Entity.java        # Persistence entity (record)
          │   │   ├── <Domain>EntityMapper.java  # MapStruct (entity ↔ domain)
          │   │   └── <Domain>Adapter.java       # Implements <Domain>Port
          │   └── messaging/<domain_name>/
          │       ├── <Domain>Producer.java      # Event producer (implements Port)
          │       ├── <Domain>Event.java         # Outbound event (record)
          │       └── <Domain>EventMapper.java   # MapStruct (event ↔ domain)
          └── api/                           # Driving adapters (inbound)
              ├── rest/<domain_name>/
              │   ├── <Domain>Resource.java      # REST controller
              │   ├── <Domain>DtoMapper.java     # MapStruct (DTO ↔ domain)
              │   └── <Domain>Dto.java           # Request/response DTOs (records)
              └── messaging/<domain_name>/
                  ├── <Domain>Consumer.java      # Event consumer
                  ├── <Domain>Event.java         # Inbound event (record)
                  └── <Domain>EventMapper.java   # MapStruct (event ↔ domain)

    - Domain (domain/<domain_name>/): pure business logic, no infrastructure
      dependencies. Each domain package contains <Domain>.java (Java record; use a
      class only with a documented reason, e.g. required mutability or a framework
      constraint), <Domain>Usecase.java (business logic, @Service), and
      <Domain>Port.java (driven/outbound port interface).
    - Infra (infra/): all infrastructure adapters, split by direction. New adapter
      technologies MUST follow infra/spi/<technology>/<domain_name>/ (driven/outbound)
      or infra/api/<protocol>/<domain_name>/ (driving/inbound):
        - infra/spi/db/<domain_name>/ — database (outbound): <Domain>Entity.java
          (record), <Domain>EntityMapper.java (MapStruct entity ↔ domain),
          <Domain>Adapter.java implementing <Domain>Port.
        - infra/spi/messaging/<domain_name>/ — messaging producer (outbound, e.g. Kafka):
          <Domain>Producer.java implementing the Port, <Domain>Event.java (outbound
          payload record), <Domain>EventMapper.java (event ↔ domain).
        - infra/api/rest/<domain_name>/ — REST (inbound): <Domain>Resource.java
          (controller), <Domain>DtoMapper.java (DTO ↔ domain), <Domain>Dto.java
          (request/response DTOs).
        - infra/api/messaging/<domain_name>/ — messaging consumer (inbound, e.g. Kafka):
          <Domain>Consumer.java (driving adapter), <Domain>Event.java (inbound payload
          record), <Domain>EventMapper.java (event ↔ domain).
    - <domain_name> MUST be the feature domain name in lowercase (e.g. checklist);
      <Domain> is its UpperCamelCase form (checklist → Checklist).
    - File naming convention (MUST): every production file name derives from <Domain>
      with these exact suffixes — for domain checklist the generated files are:
        - usecase  -> ChecklistUsecase
        - port     -> ChecklistPort
        - domain   -> Checklist (domain object record)
        - entity   -> ChecklistEntity
        - mapper   -> ChecklistEntityMapper (entity ↔ domain),
                      ChecklistDtoMapper (DTO ↔ domain)
        - adapter  -> ChecklistAdapter
        - resource -> ChecklistResource
        - dto      -> ChecklistDto
      Messaging files follow the same pattern: ChecklistProducer, ChecklistConsumer,
      ChecklistEvent, ChecklistEventMapper.
    - Dependencies MUST flow inward (infra → domain); the domain layer MUST NEVER
      import from infra.
    - Cross-layer object mapping uses MapStruct (Spring component model); domain
      objects, entities, DTOs, and event payloads are Java records (use a class only
      with a documented reason, e.g. required mutability or a framework constraint).

  Conventions:
    - Conventional Commits (e.g. build:, chore:, feat:, fix:).
    - Null-safety is enforced at compile time: NullAway in JSpecify mode with
      onlyNullMarked = true; nullness violations FAIL the build. Every package needs
      a package-info.java annotated @NullMarked (org.jspecify.annotations). Main
      types must be explicitly null-marked (RequireExplicitNullMarking). Use
      org.jspecify @Nullable/@NonNull — never JSR-305 or org.springframework.lang.
      When writing or annotating null-safe code, consult the jspecify-* skills
      first: jspecify-user-guide (where annotations belong on params/returns/
      generics/arrays), jspecify-spring-null-safety and
      jspecify-spring-framework-patterns (Spring @Contract post-conditions and the
      @Nullable vs @SuppressWarnings("NullAway.Init") inference heuristics).
      jspecify-spring-framework-patterns applies whenever an entity/aggregate has a
      database-generated id or any field populated after construction — that triggers a
      @Nullable-vs-@SuppressWarnings("NullAway.Init") decision independently of @Contract.
    - Indentation is 2 spaces.
    - Records carry the data (domain objects, entities, DTOs, event payloads); Lombok is
      scoped to the behavioural classes around them (@Service use cases, adapters) — do
      not put Lombok @Data/@Value/@Builder on a type that should be a record.
    - Tests mirror the production package under src/test/java/dev/abbah/bookstore/ (same
      domain/ + infra/ layout). Name integration tests <Type>IT and unit/slice tests
      <Type>Test. Reuse the shared TestcontainersConfiguration (PostgreSQL + Grafana
      LGTM) via @Import(TestcontainersConfiguration.class) on @SpringBootTest (and
      SpringApplication...with(...) for local runs) instead of declaring containers per
      test class; expose each container as a @Bean @ServiceConnection so Spring owns its
      lifecycle and reuses it through application-context caching (no @Testcontainers /
      @Container static-field machinery). Pin image tags — never :latest.
    - Organize production code by the hexagonal layout above (domain/ + infra/), not
      by feature-rooted Modulith packages; Spring Modulith stays for runtime
      observability/actuator, not feature packaging.
    - Prefer Spring Data JDBC aggregates and repositories; schema changes go through
      Flyway versioned migrations. Number a new migration as the next available V<N>__
      after the highest existing file in src/main/resources/db/migration; if that
      directory is empty or absent (as in the current scaffold), the first migration is
      V1__ — otherwise do not assume V1__. The description part (after V<N>__) follows
      Laravel (Eloquent) migration naming — snake_case verb phrases such as
      create_<table>_table, add_<column>_to_<table>_table,
      drop_<column>_from_<table>_table, rename_<old>_to_<new>_in_<table>_table
      (e.g. V1__create_books_table.sql, V2__add_genre_to_books_table.sql).
    - When designing or implementing backend code (REST APIs, services, data access,
      caching, async, logging) consult the springboot-* skills: springboot-patterns
      for architecture/layering and springboot-security for authn/authz, validation,
      CSRF, secrets, headers, and rate limiting.
    - For PostgreSQL work — query design, schema, indexing, and Flyway migrations —
      consult postgres-patterns and supabase-postgres-best-practices for query
      optimization and security. (This project uses Spring Data JDBC, not JPA, so the
      jpa-patterns skill does not apply.)

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - >-
      State which hexagonal package(s) the change touches (domain/<domain_name> and
      infra/{spi,api}/<technology>/<domain_name>), or that it introduces a new domain.
      This project does not use Spring Modulith feature packaging (Modulith is
      runtime-only) — do not describe changes as Modulith modules.
  design:
    - >-
      Place each new file in the hexagonal layout (domain/<domain_name>/ or
      infra/{spi,api}/<technology>/<domain_name>/); enumerate every concrete
      src/.../*.java path inline in the design body (a separate planned-files list does
      not by itself satisfy this), and confirm dependencies flow inward (infra →
      domain, never domain → infra). File names MUST follow the <Domain>-suffix naming
      convention from the project context (e.g. for domain checklist: Checklist,
      ChecklistUsecase, ChecklistPort, ChecklistEntity, ChecklistEntityMapper,
      ChecklistAdapter, ChecklistResource, ChecklistDtoMapper, ChecklistDto).
    - >-
      Declare every domain object, persistence entity, event payload, AND
      request/response DTO as a Java record in that file list; note any class-instead-of
      -record with a documented reason (e.g. required mutability or a framework constraint).
    - >-
      Note null-safety implications; all new packages need @NullMarked package-info.java.
      For non-trivial nullness decisions, apply the jspecify-* skill that matches the
      decision: jspecify-user-guide for annotation placement (params/returns/generics/
      arrays); jspecify-spring-null-safety / jspecify-spring-framework-patterns when
      Spring @Contract or @Nullable-vs-@SuppressWarnings inference is involved. Citing
      jspecify-spring-framework-patterns is required whenever an entity/aggregate has a
      database-generated id or any field populated after construction (decide @Nullable
      vs @SuppressWarnings("NullAway.Init") explicitly); absence of @Contract does NOT by
      itself make the Spring jspecify skills inapplicable. Cite only the skill(s) actually used.
    - >-
      Call out any new Flyway migration (named as the next available V<N>__ after the
      highest existing migration, or V1__ if none exist yet, with a Laravel-style
      snake_case description such as create_<table>_table or
      add_<column>_to_<table>_table) and the database
      tables/columns it adds; apply
      postgres-patterns / supabase-postgres-best-practices to schema and indexing
      decisions, and springboot-patterns / springboot-security to API and service design.
  tasks:
    - >-
      Generate tasks test-first, following the tdd skill (the red-green-refactor loop):
      write a failing test, make it pass, then refactor. Use the tdd skill specifically,
      not superpowers:test-driven-development.
    - >-
      When a task adds or annotates null-safe code, first consult the jspecify-* skill
      that fits before placing @Nullable/@NonNull/@Contract: jspecify-user-guide for
      annotation placement; jspecify-spring-null-safety / jspecify-spring-framework-patterns
      for Spring @Contract and inference heuristics — and required when an entity/aggregate
      has a database-generated id or a field populated after construction (the @Nullable
      vs @SuppressWarnings("NullAway.Init") decision applies even without @Contract). Cite
      only the skill(s) actually used.
    - >-
      When a task null-marks a whole package, structure it as a NullAway-verified loop
      and state EACH step in the task:
        (a) annotate with JSpecify + @Contract guided by the jspecify-* skills (cite only
            the jspecify-* skills actually exercised — do not auto-cite all three);
        (b) run ./gradlew build;
        (c) fix each NullAway error by correct annotation or real null handling, using
            @SuppressWarnings only with a documented justification and never to silence
            the error count;
        (d) repeat (b)-(c) until zero NullAway errors;
        (e) keep every fix inside the target package;
        (f) for any dependency whose nullness is wrong, note it explicitly and do not
            silently mutate it.
      Steps (e) and (f) are mandatory even when few errors occur.
    - >-
      When a task implements backend or database code, apply the matching skill first:
      springboot-patterns / springboot-security for Spring code, postgres-patterns /
      supabase-postgres-best-practices for SQL, schema, and migrations.
    - >-
      Include a task to verify the build passes (./gradlew build) — NullAway nullness
      checks must stay green.
    - Add or update Testcontainers-backed integration tests for new behavior.
